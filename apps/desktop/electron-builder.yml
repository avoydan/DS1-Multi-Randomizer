appId: com.ds1tr.desktop
productName: DS1 Triple Randomizer
artifactName: DS1-Triple-Randomizer-${version}-${arch}.${ext}
directories:
  app: release/package-app
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: release/runtime
    to: runtime
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  # Edit the executable resources (icon, version info) but do not sign it.
  signAndEditExecutable: true
  signExecutable: false
beforeBuild: ./scripts/skip-node-modules.cjs
afterPack: ./scripts/stage-runtime-modules.cjs
asar: true
